services:
  - type: web
    region: frankfurt # Optionnel: choisissez la région la plus proche de vos utilisateurs
    name: gescompte
    env: php
    buildCommand: |
      # Installation des dépendances
      composer install --no-interaction --optimize-autoloader --no-dev

      # 1. Effacer tous les caches pour garantir une configuration fraîche
      php artisan config:clear
      php artisan route:clear
      php artisan view:clear

      # Création du fichier .env s'il n'existe pas
      if [ ! -f ".env" ]; then cp .env.example .env; fi

      # La clé d'application (APP_KEY) est gérée par Render via les envVars, donc pas besoin de la générer ici.

      # 2. Exécution des migrations. Laravel lira maintenant les variables d'environnement directement.
      # Le flag --force est nécessaire pour l'exécution en mode non-interactif (production)
      php artisan migrate --force --seed

      # 3. Mise en cache de la configuration et des routes pour la production
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache

      # 4. Génération de la documentation Swagger
      if [ -f "vendor/darkaonline/l5-swagger/src/helpers.php" ]; then
        php artisan l5-swagger:generate --all || echo "Warning: Swagger generation failed but continuing..."
      else
        echo "Warning: L5-Swagger package not found, skipping Swagger generation"
      fi
    startCommand: >
      /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisor.conf
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        fromDatabase:
          name: app # Assurez-vous que ce service s'appelle bien 'app' dans Render
      # Variables pour la base de données de production (Neon)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-frosty-feather-adpxmgqm-pooler.c-2.us-east-1.aws.neon.tech
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_3iwEKqIn0oRy # IMPORTANT: Changez ce mot de passe sur Neon.tech dès que possible
      - key: DB_SSLMODE
        value: require
      # Variables pour la documentation Swagger en production
      - key: L5_SWAGGER_CONST_HOST
        generateValue: "https://gescompte-1.onrender.com"
      - key: L5_SWAGGER_CONST_HTTPS
        value: "true"
      - key: L5_SWAGGER_GENERATE_ALWAYS
        value: "true"
      - key: L5_SWAGGER_GENERATE_HTML
        value: "true"
