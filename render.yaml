services:
  - type: web
    name: gesbanque # Nom du service
    env: php
    buildCommand: |
      # Installation des dépendances
      composer install --no-interaction --optimize-autoloader --no-dev

      # Effacer les anciens caches pour éviter les conflits
      php artisan config:clear
      php artisan route:clear
      php artisan view:clear

      # Attendre que la base de données soit prête avant les migrations
      attempts=0
      max_attempts=30
      until PGPASSWORD="${DB_PASSWORD}" psql "postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_DATABASE}?sslmode=require" -c "SELECT 1;" > /dev/null 2>&1 || [ $attempts -ge $max_attempts ]; do
        echo "Database not ready for migrations - sleeping (attempt $((attempts+1))/$max_attempts)"
        sleep 2
        attempts=$((attempts+1))
      done

      # Exécution des migrations (le --force est nécessaire en production)
      if [ $attempts -lt $max_attempts ]; then
        php artisan migrate --force --seed
      else
        echo "Warning: Database was not ready, skipping migrations"
        php artisan migrate --force --seed || echo "Warning: Migrations failed, but continuing..."
      fi

      # Mise en cache pour la production
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache

      # Génération de la documentation Swagger
      if [ -f "vendor/darkaonline/l5-swagger/src/helpers.php" ]; then
        php artisan l5-swagger:generate --all || echo "Warning: Swagger generation failed but continuing..."
      else
        echo "Warning: L5-Swagger package not found, skipping Swagger generation"
      fi
    startCommand: >
      php artisan serve --host=0.0.0.0 --port=${PORT}
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false" # Temporairement à "true" pour voir les erreurs détaillées
      - key: APP_KEY
        sync: false # IMPORTANT: Définissez APP_KEY comme un secret dans le tableau de bord Render
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-misty-bar-a4j2hw28-pooler.us-east-1.aws.neon.tech
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false # IMPORTANT: Définissez DB_PASSWORD comme un secret dans le tableau de bord Render
      - key: DB_CONNECTION_TIMEOUT
        value: 60
      - key: DATABASE_URL
        sync: false # IMPORTANT: Définissez DATABASE_URL comme un secret dans le tableau de bord Render
      - key: APP_URL
        value: https://gesbanque.onrender.com # Remplacez par l'URL de votre service Render
      - key: LOG_CHANNEL
        value: stderr
