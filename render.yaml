services:
  - type: web
    name: gescompte
    env: php
    buildCommand: |
      # Installation des dépendances
      composer install --no-interaction --optimize-autoloader --no-dev
      
      # Configuration de l'application
      php artisan config:clear
      php artisan config:cache
      
      # Création du fichier .env s'il n'existe pas
      if [ ! -f ".env" ]; then
        cp .env.example .env
      fi

      # Génération de la clé d'application
      php -r "\$envFile = '.env'; \
        \$key = 'base64:' . base64_encode(random_bytes(32)); \
        \$content = file_get_contents(\$envFile); \
        \$content = preg_replace('/^APP_KEY=.*/m', 'APP_KEY=' . \$key, \$content); \
        file_put_contents(\$envFile, \$content);"
      
      # Configuration de l'application
      php artisan config:clear
      php artisan config:cache
      
      # Optimisation des routes et vues
      php artisan route:clear
      php artisan route:cache
      php artisan view:clear
      php artisan view:cache

      # Exécution des migrations pour créer les tables
      php artisan migrate --force

      # Configuration et génération de la documentation Swagger
      if [ -f "vendor/darkaonline/l5-swagger/src/helpers.php" ]; then
        php artisan vendor:publish --provider="L5Swagger\L5SwaggerServiceProvider" --tag=config
        php artisan l5-swagger:generate --all || echo "Warning: Swagger generation failed but continuing..."
      else
        echo "Warning: L5-Swagger package not found, skipping Swagger generation"
      fi
    startCommand: >
      php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        fromDatabase:
          name: app
          key: APP_KEY
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: postgres
          property: hostname
      - key: DB_PORT
        fromDatabase:
          name: postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: postgres
          property: password
      - key: L5_SWAGGER_CONST_HOST
        generateValue: "https://gescompte-1.onrender.com"
      - key: L5_SWAGGER_CONST_HTTPS
        value: "true"
      - key: L5_SWAGGER_GENERATE_ALWAYS
        value: "true"
      - key: L5_SWAGGER_GENERATE_HTML
        value: "true"
      - key: L5_SWAGGER_UI_DISPLAY_OAUTH_REDIRECT
        value: "false"
