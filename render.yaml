services:
  - type: web
    name: gescompte
    env: php
    buildCommand: |
      # Installation des dépendances
      composer install --no-interaction --optimize-autoloader --no-dev
      
      # Configuration de l'application
      php artisan config:clear
      php artisan config:cache
      
      # Génération de la clé d'application si elle n'existe pas
      if [ -z "$APP_KEY" ]; then
        php artisan key:generate --force
      fi
      
      # Optimisation des routes et vues
      php artisan route:clear
      php artisan route:cache
      php artisan view:clear
      php artisan view:cache

      php artisan l5-swagger:publish
      php artisan l5-swagger:generate
      
      # Génération de la documentation Swagger (si le package est installé)
      if [ -f "vendor/darkaonline/l5-swagger/bin/generate" ]; then
        php artisan l5-swagger:generate || true
      fi
    startCommand: >
      php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        fromDatabase:
          name: app
          key: APP_KEY
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: postgres
          property: hostname
      - key: DB_PORT
        fromDatabase:
          name: postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: postgres
          property: password
      - key: L5_SWAGGER_CONST_HOST
        generateValue: "https://gescompte-1.onrender.com"
      - key: L5_SWAGGER_CONST_HTTPS
        value: "true"
      - key: L5_SWAGGER_GENERATE_ALWAYS
        value: "true"
      - key: L5_SWAGGER_GENERATE_HTML
        value: "true"
      - key: L5_SWAGGER_UI_DISPLAY_OAUTH_REDIRECT
        value: "false"
